<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f86ff"/>
      <stop offset=".55" stop-color="#1450c8"/>
      <stop offset="1" stop-color="#0a2a66"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4e8ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="512" height="512" rx="120"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- water line -->
  <rect x="0" y="360" width="512" height="152" fill="url(#water)" clip-path="url(#r)"/>
  <path d="M72 362h368" stroke="#8fe0ff" stroke-width="12" stroke-linecap="round" opacity=".7"/>
  <!-- ice floe -->
  <path d="M120 356 200 168l58 74 44-60 90 174Z" fill="url(#ice)"/>
  <path d="M200 168l26 104-50 84M302 182l-16 76 50 98" stroke="#93cdf2" stroke-width="10" fill="none" stroke-linejoin="round"/>
  <!-- submerged part -->
  <path d="M150 372h220l-40 52H196Z" fill="#bfe6ff" opacity=".35"/>
  <!-- growth arrow -->
  <path d="M330 92h84v84" stroke="#7dffb0" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M414 92 318 188" stroke="#7dffb0" stroke-width="26" stroke-linecap="round"/>
</svg>
